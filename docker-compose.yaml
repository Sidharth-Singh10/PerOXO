services:
  scylladb:
    image: scylladb/scylla:2026.3.4@sha256:d864230da81af7f6cdcf68446a440e0e4a55a0827fcf49af00725f660e8647d3
    container_name: scylla
    volumes:
      - scylla_data:/var/lib/scylla
    environment:
      - SCYLLA_CLUSTER_NAME=chat_cluster
      - SCYLLA_DC=datacenter1
      - SCYLLA_RACK=rack1
    healthcheck:
      test: ["CMD-SHELL", "nodetool status"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    networks:
      - chat_network

  chat-service:
    build:
      context: ./chat-service
      dockerfile: Dockerfile
    container_name: chat-service
    depends_on:
      scylladb:
        condition: service_healthy
    environment:
      - RUST_LOG=info
      - SCYLLA_HOST=scylladb:9042
      # single-node dev cluster: One would be the durable LocalQuorum value in prod
      - SCYLLA_CONSISTENCY=One
      - SCYLLA_REPLICATION_FACTOR=1
      - GRPC_ADDR=[::]:50052
      # Every internal gRPC caller must present this secret.
      - GRPC_SHARED_SECRET=${GRPC_SHARED_SECRET:?set GRPC_SHARED_SECRET}
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:50052"]
    networks:
      - chat_network

  auth-service:
    build:
      context: ./auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      # Public API. Terminate TLS in front of this port.
      - "3004:3004"
    depends_on:
      redis:
        condition: service_healthy
    env_file: ./auth-service/.env
    environment:
      - GRPC_ADDR=[::]:50053
      - REDIS_URL=redis://:${REDIS_PASSWORD:?set REDIS_PASSWORD}@redis:6379
      - GRPC_SHARED_SECRET=${GRPC_SHARED_SECRET:?set GRPC_SHARED_SECRET}
    healthcheck:
      test: ["CMD", "grpc_health_probe", "-addr=localhost:50053"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - chat_network

  per-oxo:
    build:
      context: ./peroxo
      dockerfile: Dockerfile
    container_name: per-oxo
    ports:
      - "4001:3000"
    environment:
      - RUST_LOG=debug
      - CHAT_SERVICE_ADDR=http://chat-service:50052
      - AUTH_SERVICE_ADDR=http://auth-service:50053
      - PER_OXO_SERVICE_ADDR=0.0.0.0:3000
      # Metrics are internal only; the port is not published.
      - PER_OXO_METRICS_ADDR=0.0.0.0:9100
      - GRPC_SHARED_SECRET=${GRPC_SHARED_SECRET:?set GRPC_SHARED_SECRET}
    depends_on:
      chat-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - chat_network
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1@sha256:fa3302279710be2f21a8301ec17a8b4f2301fd829bd113839b3b6b02b6f191a2
    container_name: prometheus
    ports:
      # Admin UI is for the operator's machine only.
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
    networks:
      - chat_network

  grafana:
    image: grafana/grafana:13.2.5@sha256:9f7aa1e1e3246aade5792d35a738049f7f32f89cd51d1956cf426a4e86268a84
    container_name: grafana
    ports:
      - "127.0.0.1:9091:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:?set GRAFANA_ADMIN_PASSWORD}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_AUTH_ANONYMOUS_ENABLED=false
    networks:
      - chat_network
    depends_on:
      - prometheus

  redis:
    image: redis:8.10.3@sha256:298641b35ac51aa999f9bb85707d6681fe635ce59cda51886a0b6adc1da37b8e
    container_name: redis_auth
    command:
      - redis-server
      - --requirepass
      - ${REDIS_PASSWORD:?set REDIS_PASSWORD}
    environment:
      - REDIS_PASSWORD=${REDIS_PASSWORD:?set REDIS_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - chat_network

volumes:
  scylla_data:
    driver: local
  prometheus_data:
  grafana_data:
networks:
  chat_network:
    driver: bridge
