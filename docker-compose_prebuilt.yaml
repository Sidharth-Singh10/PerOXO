  #     - RUST_LOG=info
  #     - GRPC_ADDR=[::]:50053
  #     - DATABASE_URL=XXXXXXXXXXXXXXXXXXXXXX
  #   networks:
  #     - chat_network
  #   healthcheck:
  #     test: ["CMD", "grpc_health_probe", "-addr=localhost:50053"]

volumes:
  scylla_data:
    driver: local

networks:
  chat_network:
    driver: bridge